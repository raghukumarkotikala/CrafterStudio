name: Feature request
description: Suggest something Crafter Studio should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job you are trying to get done, not just the feature. It often turns out there is a better fix than the one first imagined.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: false
  - type: input
    id: workaround
    attributes:
      label: How do you handle it today?
      placeholder: I export SVG and finish it in LightBurn
    validations:
      required: false
