name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --x64
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run library
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: crafter-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
