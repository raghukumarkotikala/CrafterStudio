name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed so the release job can create a release and upload binaries to it.
permissions:
  contents: write

jobs:
  build:
    # electron-builder publishes implicitly when it detects CI + a git tag;
    # --publish never keeps building side-effect free and leaves releasing to the
    # release job, which has the token and the tag message.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --x64 --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run library
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: crafter-studio-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage

  release:
    # Only tag pushes publish. A manual run still builds and leaves artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the annotated tag (and its message) is available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Use the annotated tag message as the release notes
        run: |
          # actions/checkout leaves behind a lightweight tag ref, and %(contents)
          # on a lightweight tag yields the commit message instead of the tag
          # annotation. Refetch the real tag object before reading it.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          echo "tag object type: $(git cat-file -t "$GITHUB_REF_NAME")"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Crafter Studio ${{ github.ref_name }}
          body_path: notes.md
          # Published manually after checking the binaries. Set to false to
          # publish automatically on every tag.
          draft: true
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
