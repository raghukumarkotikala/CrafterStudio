name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed so the release job can create a release and upload binaries to it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --x64
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run library
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: crafter-studio-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage

  release:
    # Only tag pushes publish. A manual run still builds and leaves artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the annotated tag (and its message) is available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Use the annotated tag message as the release notes
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Crafter Studio ${{ github.ref_name }}
          body_path: notes.md
          # Published manually after checking the binaries. Set to false to
          # publish automatically on every tag.
          draft: true
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
