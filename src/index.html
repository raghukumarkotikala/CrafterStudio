<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;">
  <title>Crafter Studio</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <div id="toolopts"></div>
    <div id="main">
      <nav id="toolbox"></nav>
      <div id="stage">
        <div id="ruler-corner" title="mm"></div>
        <canvas id="ruler-top"></canvas>
        <canvas id="ruler-left"></canvas>
        <div id="canvas-wrap">
          <canvas id="canvas"></canvas>
          <canvas id="preview-canvas" hidden></canvas>
          <div id="preview-bar" hidden></div>
          <div id="empty-hint">
            <div class="eh-title">Start designing</div>
            <div>Draw with the tools on the left, or drop an SVG, DXF or image here.</div>
          </div>
        </div>
      </div>
      <aside id="sidebar">
        <div id="tabs"></div>
        <div id="tab-body"></div>
      </aside>
    </div>
    <footer id="bottombar">
      <div id="palette"></div>
      <div id="status"></div>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="ctxmenu" hidden></div>

  <script src="../node_modules/paper/dist/paper-core.min.js"></script>
  <script src="../node_modules/paperjs-offset/dist/index.umd.js"></script>
  <script src="../node_modules/opentype.js/dist/opentype.min.js"></script>
  <script src="../node_modules/imagetracerjs/imagetracer_v1.2.6.js"></script>
  <script src="../node_modules/dxf-parser/dist/dxf-parser.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
